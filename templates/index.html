
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="container">

        <div class="eyebrow">
            <span class="status-dot"></span>
            QUICK SECURITY CHECK
        </div>

        <h1>Password strength</h1>

        <p class="subtitle">
            Check the basics and get clear suggestions to improve your password.
        </p>

        <form action="/" method="POST">
            <label for="password">Enter a password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Type a password to check"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="eye-button"
                    aria-label="Show password"
                    aria-pressed="false"
                    title="Show password"
                >
                    <svg id="eyeIcon"
                         xmlns="http://www.w3.org/2000/svg"
                         width="22" height="22"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button type="submit" class="check-button">
                Check password
            </button>
        </form>

        {{RESULT}}

        <p class="hint">
            Checks for 8+ characters, uppercase, lowercase, a number,
            and a special character.
        </p>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        toggleButton.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";

            toggleButton.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );

            toggleButton.setAttribute(
                "title",
                isHidden ? "Hide password" : "Show password"
            );

            toggleButton.setAttribute(
                "aria-pressed",
                String(isHidden)
            );

            if (isHidden) {
                eyeIcon.innerHTML = `
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5
                             c6.5 0 10 7 10 7a15.7 15.7 0 0 1-4 4.8"/>
                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7
                             c1.2 0 2.3-.2 3.3-.6"/>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path d="M2 12s3.5-7 10-7 10 7 10 7
                             -3.5 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        });
    </script>
</body>
</html>
